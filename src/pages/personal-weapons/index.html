<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>专武 - 另一个伊甸攻略站</title>
</head>
<body>
  <div id="app">
    <button class="sidebar-toggle" @click="toggleSidebar">☰</button>
    <div class="sidebar-overlay" :class="{ show: sidebarOpen }" @click="toggleSidebar"></div>
    <aside class="sidebar" :class="{ open: sidebarOpen }">
      <app-sidebar current-page="personal-weapons"></app-sidebar>
    </aside>
    <main class="main-content">
      <div class="char-page-header">
        <div>
          <h1 class="char-page-title">专武</h1>
          <p class="char-page-count">共 <strong>{{ filteredData.length }}</strong> 件专武</p>
        </div>
      </div>
      <search-bar v-model="searchQuery" placeholder="搜索专武..." :filters="filterOptions" v-model:filter-value="filterValue"></search-bar>
      <div class="tab-bar">
        <button class="tab-btn" :class="{ active: activeTab === '结果' }" @click="activeTab = '结果'">结果</button>
        <button class="tab-btn" :class="{ active: activeTab === '显现' }" @click="activeTab = '显现'">显现</button>
      </div>
      <data-table :columns="columns" :data="filteredData" empty-text="没有找到符合条件的专武" :show-id="false" avatar-key="character"></data-table>
    </main>
  </div>
  <script type="module">
    import { createApp } from "vue"
    import AppSidebar from "../../components/AppSidebar.vue"
    import SearchBar from "../../components/SearchBar.vue"
    import DataTable from "../../components/DataTable.vue"
    import { samplePersonalWeapons } from "../../data/samples/personal-weapons.js"
    import "../../assets/styles/variables.css"
    import "../../assets/styles/reset.css"
    import "../../assets/styles/layout.css"
    import "../../assets/styles/sidebar.css"
    import "../../assets/styles/table.css"

    const columns = [
      { label: '专武名称', key: 'name', sortable: false },
      { label: '效果', key: 'effect', sortable: false }
    ]

    const app = createApp({
      data() {
        return { searchQuery: "", filterValue: "", activeTab: "结果", columns, filterOptions: [], sidebarOpen: window.innerWidth > 768 }
      },
      computed: {
        filteredData() {
          let list = samplePersonalWeapons.filter(r => r.tab === this.activeTab)
          if (this.searchQuery) {
            const q = this.searchQuery.toLowerCase()
            list = list.filter(r => ['name', 'character', 'effect'].some(k => r[k] && r[k].toString().toLowerCase().includes(q)))
          }
          return list
        }
      },
      methods: {
        toggleSidebar() { this.sidebarOpen = !this.sidebarOpen }
      }
    })
    app.component("app-sidebar", AppSidebar)
    app.component("search-bar", SearchBar)
    app.component("data-table", DataTable)
    app.mount("#app")
  </script>
</body>
</html>
