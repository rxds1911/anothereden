<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>书架 - 另一个伊甸攻略站</title>
</head>
<body>
  <div id="app">
    <button class="sidebar-toggle" @click="toggleSidebar">☰</button>
    <div class="sidebar-overlay" :class="{ show: sidebarOpen }" @click="toggleSidebar"></div>
    <aside class="sidebar" :class="{ open: sidebarOpen }">
      <app-sidebar current-page="bookshelf"></app-sidebar>
    </aside>
    <main class="main-content">
      <div class="char-page-header">
        <div>
          <h1 class="char-page-title">书架</h1>
          <p class="char-page-count">共 <strong>{{ filteredData.length }}</strong> 本书</p>
        </div>
      </div>
      <search-bar v-model="searchQuery" placeholder="搜索书架..." :filters="filterOptions" v-model:filter-value="filterValue"></search-bar>
      <div class="filter-bar">
        <div class="filter-group">
          <span class="filter-label">类型</span>
          <span v-for="t in bookTypes" :key="t"
            class="filter-chip" :class="{ active: filterType === t }"
            @click="filterType = filterType === t ? '' : t">{{ t }}</span>
        </div>
      </div>
      <data-table :columns="columns" :data="filteredData" empty-text="没有找到符合条件的书" :show-id="false" :show-avatar="false" @row-click="goToDetail"></data-table>
    </main>
  </div>
  <script type="module">
    import { createApp } from "vue"
    import AppSidebar from "../../components/AppSidebar.vue"
    import SearchBar from "../../components/SearchBar.vue"
    import DataTable from "../../components/DataTable.vue"
    import { sampleBookshelf } from "../../data/samples/bookshelf.js"
    import { bookTypes } from "../../data/config.js"
    import { filterRows } from "../../utils/filter.js"
    import "../../assets/styles/variables.css"
    import "../../assets/styles/reset.css"
    import "../../assets/styles/layout.css"
    import "../../assets/styles/sidebar.css"
    import "../../assets/styles/table.css"

    const columns = [
      { label: '书名', key: 'name', sortable: false },
      { label: '类型', key: 'type', sortable: false },
      { label: '加成对象', key: 'bonus', sortable: false }
    ]

    const app = createApp({
      data() {
        return { searchQuery: "", filterValue: "", filterType: "", columns, filterOptions: [], bookTypes, sidebarOpen: window.innerWidth > 768 }
      },
      computed: {
        filteredData() {
          return filterRows(sampleBookshelf, {
            filters: [{ field: 'type', values: this.filterType ? [this.filterType] : [] }],
            searchFields: ['name', 'type', 'bonus'],
            query: this.searchQuery
          })
        }
      },
      methods: {
        toggleSidebar() { this.sidebarOpen = !this.sidebarOpen },
        goToDetail(row) { window.location.href = "../bookshelf-detail/index.html?id=" + row.id }
      }
    })
    app.component("app-sidebar", AppSidebar)
    app.component("search-bar", SearchBar)
    app.component("data-table", DataTable)
    app.mount("#app")
  </script>
</body>
</html>
