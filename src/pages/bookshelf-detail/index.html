<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>书架详情 - 另一个伊甸攻略站</title>
</head>
<body>
  <div id="app">
    <button class="sidebar-toggle" @click="toggleSidebar">☰</button>
    <div class="sidebar-overlay" :class="{ show: sidebarOpen }" @click="toggleSidebar"></div>
    <aside class="sidebar" :class="{ open: sidebarOpen }">
      <app-sidebar current-page="bookshelf"></app-sidebar>
    </aside>
    <main class="main-content" v-if="detail">
      <a class="back-link" href="../bookshelf/index.html">← 返回书架列表</a>
      <div class="char-page-header">
        <div>
          <h1 class="char-page-title">{{ detail.name }}</h1>
          <p class="char-page-count">{{ detail.type }}</p>
        </div>
      </div>

      <!-- 修复条件 -->
      <div class="detail-section">
        <div class="detail-section-header"><span class="icon">📜</span> 修复条件一览</div>
        <div class="behavior-table-wrap">
          <table class="ability-table">
            <thead>
              <tr>
                <th>修复条件</th>
                <th>修复报酬</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="(row, i) in detail.repairConditions" :key="i" :class="{ 'contract-alt': row.alt }">
                <td class="contract-condition">{{ row.condition }}</td>
                <td class="drop-list contract-reward">
                  <div v-for="r in row.rewards" :key="r">・{{ r }}</div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 报酬阶段 -->
      <div class="detail-section">
        <div class="detail-section-header"><span class="icon">🎁</span> 报酬阶段</div>
        <div class="behavior-table-wrap">
          <table class="ability-table">
            <thead>
              <tr>
                <th style="width: 120px;">报酬阶段</th>
                <th>报酬</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="s in detail.rewardStages" :key="s.stage">
                <td class="stage-no">{{ s.stage }}</td>
                <td>{{ s.reward }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 加成角色 -->
      <div class="detail-section">
        <div class="detail-section-header"><span class="icon">⭐</span> 加成角色编成提升分数</div>
        <div class="behavior-table-wrap">
          <table class="ability-table">
            <thead>
              <tr>
                <th style="width: 360px;">加成对象</th>
                <th style="width: 140px;">点数</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="(bc, i) in detail.bonusCharacters" :key="i">
                <td>{{ bc.target }}</td>
                <td class="points">・{{ bc.points }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 攻略查找 + 投稿 -->
      <guide-section
        v-if="detail"
        :item-id="'bookshelf-' + detail.id"
        :item-name="detail.name"
        :builtin-guide="detail.videoUrl ? detail : null"
      ></guide-section>
    </main>
  </div>
  <script type="module">
    import { createApp } from "vue"
    import AppSidebar from "../../components/AppSidebar.vue"
    import GuideSection from "../../components/GuideSection.vue"
    import { bookshelfDetails } from "../../data/samples/bookshelf-details.js"
    import "../../assets/styles/variables.css"
    import "../../assets/styles/reset.css"
    import "../../assets/styles/layout.css"
    import "../../assets/styles/sidebar.css"
    import "../../assets/styles/table.css"
    import "../../assets/styles/detail.css"

    const params = new URLSearchParams(window.location.search)
    const bookId = params.get('id')
    const detail = bookshelfDetails.find(r => String(r.id) === bookId) || null

    const app = createApp({
      data() { return { detail, sidebarOpen: window.innerWidth > 768 } },
      methods: { toggleSidebar() { this.sidebarOpen = !this.sidebarOpen } }
    })
    app.component("app-sidebar", AppSidebar)
    app.component("guide-section", GuideSection)
    app.mount("#app")
  </script>
</body>
</html>
