<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>猫 - 另一个伊甸攻略站</title>
</head>
<body>
  <div id="app">
    <button class="sidebar-toggle" @click="toggleSidebar">☰</button>
    <div class="sidebar-overlay" :class="{ show: sidebarOpen }" @click="toggleSidebar"></div>
    <aside class="sidebar" :class="{ open: sidebarOpen }">
      <app-sidebar current-page="cats"></app-sidebar>
    </aside>
    <main class="main-content">
      <div class="char-page-header">
        <div>
          <h1 class="char-page-title">猫</h1>
          <p class="char-page-count">共 <strong>{{ filteredData.length }}</strong> 只猫</p>
        </div>
      </div>
      <search-bar v-model="searchQuery" placeholder="搜索猫..." :filters="filterOptions" v-model:filter-value="filterValue"></search-bar>
      <data-table :columns="columns" :data="filteredData" empty-text="没有找到符合条件的猫" :show-id="false" :two-column-detail="true"></data-table>
    </main>
  </div>
  <script type="module">
    import { createApp } from "vue"
    import AppSidebar from "../../components/AppSidebar.vue"
    import SearchBar from "../../components/SearchBar.vue"
    import DataTable from "../../components/DataTable.vue"
    import { sampleCats } from "../../data/samples/cats.js"
    import "../../assets/styles/variables.css"
    import "../../assets/styles/reset.css"
    import "../../assets/styles/layout.css"
    import "../../assets/styles/sidebar.css"
    import "../../assets/styles/table.css"

    const columns = [
      { label: '名称', key: 'name', sortable: false },
      { label: '住处', key: 'home', sortable: false },
      { label: '出现条件', key: 'condition', sortable: false },
      { label: '性别', key: 'gender', sortable: false },
      { label: '性格', key: 'personality', sortable: false }
    ]

    const app = createApp({
      data() {
        return { searchQuery: "", filterValue: "", columns, filterOptions: [], sidebarOpen: window.innerWidth > 768 }
      },
      computed: {
        filteredData() {
          let list = sampleCats
          if (this.searchQuery) {
            const q = this.searchQuery.toLowerCase()
            list = list.filter(r => ['name', 'home', 'condition', 'gender', 'personality'].some(k => r[k] && r[k].toString().toLowerCase().includes(q)))
          }
          return list
        }
      },
      methods: {
        toggleSidebar() { this.sidebarOpen = !this.sidebarOpen }
      }
    })
    app.component("app-sidebar", AppSidebar)
    app.component("search-bar", SearchBar)
    app.component("data-table", DataTable)
    app.mount("#app")
  </script>
</body>
</html>
