<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>地图 - 另一个伊甸攻略站</title>
</head>
<body>
  <div id="app">
    <button class="sidebar-toggle" @click="toggleSidebar">☰</button>
    <div class="sidebar-overlay" :class="{ show: sidebarOpen }" @click="toggleSidebar"></div>
    <aside class="sidebar" :class="{ open: sidebarOpen }">
      <app-sidebar current-page="maps"></app-sidebar>
    </aside>
    <main class="main-content">
      <div class="char-page-header">
        <div>
          <h1 class="char-page-title">地图</h1>
          <p class="char-page-count">共 <strong>{{ filteredData.length }}</strong> 个区域</p>
        </div>
      </div>
      <search-bar v-model="searchQuery" placeholder="搜索地图..." :filters="filterOptions" v-model:filter-value="filterValue"></search-bar>
      <div class="filter-bar">
        <div class="filter-group">
          <span class="filter-label">时代</span>
          <span v-for="t in storyEras" :key="t"
            class="filter-chip" :class="{ active: filterEra === t }"
            @click="filterEra = filterEra === t ? '' : t">{{ t }}</span>
        </div>
      </div>
      <data-table :columns="columns" :data="filteredData" empty-text="没有找到符合条件的地图" :show-id="false" :show-avatar="false"></data-table>
    </main>
  </div>
  <script type="module">
    import { createApp } from "vue"
    import AppSidebar from "../../components/AppSidebar.vue"
    import SearchBar from "../../components/SearchBar.vue"
    import DataTable from "../../components/DataTable.vue"
    import { sampleMaps } from "../../data/samples/maps.js"
    import { storyEras } from "../../data/config.js"
    import "../../assets/styles/variables.css"
    import "../../assets/styles/reset.css"
    import "../../assets/styles/layout.css"
    import "../../assets/styles/sidebar.css"
    import "../../assets/styles/table.css"

    const columns = [
      { label: '地图', key: 'name', sortable: false },
      { label: '时代', key: 'era', sortable: false },
      { label: '区域', key: 'area', sortable: false }
    ]

    const app = createApp({
      data() {
        return { searchQuery: "", filterValue: "", filterEra: "", columns, filterOptions: [], storyEras, sidebarOpen: window.innerWidth > 768 }
      },
      computed: {
        filteredData() {
          let list = sampleMaps
          if (this.filterEra) {
            list = list.filter(r => r.era === this.filterEra)
          }
          if (this.searchQuery) {
            const q = this.searchQuery.toLowerCase()
            list = list.filter(r => ['name', 'era', 'area'].some(k => r[k] && r[k].toString().toLowerCase().includes(q)))
          }
          return list
        }
      },
      methods: {
        toggleSidebar() { this.sidebarOpen = !this.sidebarOpen }
      }
    })
    app.component("app-sidebar", AppSidebar)
    app.component("search-bar", SearchBar)
    app.component("data-table", DataTable)
    app.mount("#app")
  </script>
</body>
</html>
