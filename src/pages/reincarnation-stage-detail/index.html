<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>回生关卡详情 - 另一个伊甸攻略站</title>
</head>
<body>
  <div id="app">
    <button class="sidebar-toggle" @click="toggleSidebar">☰</button>
    <div class="sidebar-overlay" :class="{ show: sidebarOpen }" @click="toggleSidebar"></div>
    <aside class="sidebar" :class="{ open: sidebarOpen }">
      <app-sidebar current-page="reincarnation"></app-sidebar>
    </aside>
    <main class="main-content" v-if="stage && trial">
      <a class="back-link" :href="'../reincarnation-detail/index.html?id=' + trial.id + '&difficulty=' + difficulty">← 返回关卡列表</a>
      <div class="char-page-header">
        <div>
          <h1 class="char-page-title">{{ trial.name }}</h1>
          <p class="char-page-count">第{{ stageNo }}关 · {{ difficulty }}</p>
        </div>
      </div>

      <!-- 回生报酬 -->
      <div class="detail-section">
        <div class="detail-section-header"><span class="icon">🎁</span> 回生报酬</div>
        <div class="reward-panel">
          <div class="reward-bar">通关奖励</div>
          <div class="clear-reward">{{ clearReward }}</div>
          <div class="reward-bar">任务条件/奖励</div>
          <div v-for="(m, i) in stage.missions" :key="i" class="mission-block">
            <div class="mission-condition">【{{ m.condition }}】</div>
            <div class="mission-reward">・{{ m.reward }}</div>
          </div>
        </div>
      </div>

      <!-- 回生敌人 -->
      <div class="detail-section">
        <div class="detail-section-header"><span class="icon">👹</span> 出现Boss弱点与行动模式</div>
        <div class="behavior-table-wrap">
          <table class="ability-table">
            <thead>
              <tr>
                <th style="width: 80px;">Wave</th>
                <th>Boss</th>
                <th>弱点</th>
                <th>耐性</th>
              </tr>
            </thead>
            <tbody>
              <template v-for="(w, wi) in waves" :key="w.wave">
                <tr v-for="(b, bi) in w.bosses" :key="bi">
                  <td v-if="bi === 0" :rowspan="w.bosses.length" class="wave-no">{{ w.wave }}</td>
                  <td class="boss-name">{{ b.name }}</td>
                  <td>
                    <span class="tags-cell">
                      <span v-for="tag in splitTags(b.weakness)" :key="tag" class="tag" :class="'tag-' + tag">{{ tag }}</span>
                    </span>
                  </td>
                  <td>
                    <span class="tags-cell">
                      <span v-for="tag in splitTags(b.resist)" :key="tag" class="tag" :class="'tag-' + tag">{{ tag }}</span>
                      <span v-if="b.note" class="resist-note">({{ b.note }})</span>
                    </span>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 攻略查找 + 投稿 -->
      <guide-section
        v-if="stage && trial"
        :item-id="'reincarnation-' + trial.id + '-' + difficulty + '-' + stageNo"
        :item-name="trial.name"
        :builtin-guide="builtinGuide"
      ></guide-section>
    </main>
  </div>
  <script type="module">
    import { createApp } from "vue"
    import AppSidebar from "../../components/AppSidebar.vue"
    import GuideSection from "../../components/GuideSection.vue"
    import { sampleReincarnation } from "../../data/samples/reincarnation.js"
    import { reincarnationStages } from "../../data/samples/reincarnation-stages.js"
    import { reincarnationBosses } from "../../data/samples/reincarnation-bosses.js"
    import "../../assets/styles/variables.css"
    import "../../assets/styles/reset.css"
    import "../../assets/styles/layout.css"
    import "../../assets/styles/sidebar.css"
    import "../../assets/styles/table.css"
    import "../../assets/styles/detail.css"

    const params = new URLSearchParams(window.location.search)
    const trialId = params.get('id')
    const difficulty = params.get('difficulty') === 'Extreme' ? 'Extreme' : 'Normal'
    const stageNo = parseInt(params.get('stage') || '1', 10)
    const trial = sampleReincarnation.find(r => String(r.id) === trialId) || null
    const stage = (reincarnationStages[difficulty] || [])[stageNo - 1] || null
    const team = {
      front: ['阿尔德', '菲奈', '茜', '艾米'],
      back: ['莉卡', '塞温'],
      partner: ['帕蒂', '克罗德']
    }
    const videoUrl = 'https://player.bilibili.com/player.html?bvid=BV1GJ411x7y7&autoplay=0'
    const builtinGuide = trial
      ? { title: `「${trial.name}」第${stageNo}关示例攻略`, url: videoUrl, team }
      : null

    const app = createApp({
      data() { return { trial, stage, difficulty, stageNo, builtinGuide, sidebarOpen: window.innerWidth > 768 } },
      computed: {
        clearReward() {
          const base = difficulty === 'Extreme' ? 30 : 20
          return '克罗诺斯之石×' + (base + stageNo * 5)
        },
        waves() {
          const pool = reincarnationBosses[difficulty] || []
          return pool.map((w, i) => ({ ...w, bosses: w.bosses.map(b => ({ ...b, name: b.name + '·' + ['序', '终', '深'][(stageNo - 1 + i) % 3] })) }))
        }
      },
      methods: {
        toggleSidebar() { this.sidebarOpen = !this.sidebarOpen },
        splitTags(value) {
          return String(value).split(/[、,，/]/).map(s => s.trim()).filter(Boolean)
        }
      }
    })
    app.component("app-sidebar", AppSidebar)
    app.component("guide-section", GuideSection)
    app.mount("#app")
  </script>
</body>
</html>
