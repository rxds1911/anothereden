<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>武器 - 另一个伊甸攻略站</title>
</head>
<body>
  <div id="app">
    <button class="sidebar-toggle" @click="toggleSidebar">☰</button>
    <div class="sidebar-overlay" :class="{ show: sidebarOpen }" @click="toggleSidebar"></div>
    <aside class="sidebar" :class="{ open: sidebarOpen }">
      <app-sidebar current-page="weapons"></app-sidebar>
    </aside>
    <main class="main-content">
      <div class="char-page-header">
        <div>
          <h1 class="char-page-title">武器</h1>
          <p class="char-page-count">共 <strong>{{ filteredData.length }}</strong> 件武器</p>
        </div>
      </div>
      <search-bar v-model="searchQuery" placeholder="搜索武器..." :filters="filterOptions" v-model:filter-value="filterValue"></search-bar>
      <div class="filter-bar">
        <div class="filter-group">
          <span class="filter-label">类型</span>
          <span v-for="t in weaponTypes" :key="t"
            class="filter-chip" :class="{ active: filterType === t }"
            @click="filterType = filterType === t ? '' : t">{{ t }}</span>
        </div>
      </div>
      <data-table :columns="columns" :data="filteredData" empty-text="没有找到符合条件的武器" :show-id="false" :two-column-detail="true"></data-table>
    </main>
  </div>
  <script type="module">
    import { createApp } from "vue"
    import AppSidebar from "../../components/AppSidebar.vue"
    import SearchBar from "../../components/SearchBar.vue"
    import DataTable from "../../components/DataTable.vue"
    import { sampleWeapons } from "../../data/samples/weapons.js"
    import { weaponTypes } from "../../data/config.js"
    import { filterRows } from "../../utils/filter.js"
    import "../../assets/styles/variables.css"
    import "../../assets/styles/reset.css"
    import "../../assets/styles/layout.css"
    import "../../assets/styles/sidebar.css"
    import "../../assets/styles/table.css"

    const columns = [
      { label: '名称', key: 'name', sortable: false },
      { label: '类型', key: 'type', sortable: false },
      { label: '装备等级', key: 'equipLevel', sortable: false, format: v => 'Lv.' + v },
      { label: '攻击', key: 'atk', sortable: false },
      { label: '魔攻', key: 'matk', sortable: false, format: v => v || '—' },
      { label: '装备条件', key: 'condition', sortable: false },
      { label: '获取方式', key: 'source', sortable: false },
      { label: '发动效果', key: 'effect', sortable: false }
    ]

    const app = createApp({
      data() {
        return { searchQuery: "", filterValue: "", filterType: "", columns, filterOptions: [], weaponTypes, sidebarOpen: window.innerWidth > 768 }
      },
      computed: {
        filteredData() {
          return filterRows(sampleWeapons, {
            filters: [{ field: 'type', values: this.filterType ? [this.filterType] : [] }],
            searchFields: ['name', 'character', 'type', 'equipLevel', 'atk', 'matk', 'condition', 'source', 'effect'],
            query: this.searchQuery
          })
        }
      },
      methods: {
        toggleSidebar() { this.sidebarOpen = !this.sidebarOpen }
      }
    })
    app.component("app-sidebar", AppSidebar)
    app.component("search-bar", SearchBar)
    app.component("data-table", DataTable)
    app.mount("#app")
  </script>
</body>
</html>
