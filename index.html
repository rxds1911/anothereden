<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>另一个伊甸 - 攻略查询站</title>
  <link rel="icon" href="/favicon.ico" />
</head>
<body>
  <div id="app">
    <button class="sidebar-toggle" @click="toggleSidebar">☰</button>
    <div class="sidebar-overlay" :class="{ show: sidebarOpen }" @click="toggleSidebar"></div>
    <aside class="sidebar" :class="{ open: sidebarOpen }">
      <app-sidebar current-page="index"></app-sidebar>
    </aside>
    <main class="main-content">

      <!-- Carousel -->
      <div class="carousel-wrap">
        <div class="carousel" @mouseenter="carouselPause" @mouseleave="carouselResume">
          <div v-for="(ev, i) in recentCarousel" :key="i" class="carousel-slide" :class="{ active: carouselIndex === i }">
            <img :src="ev.img" :alt="ev.name" class="carousel-img" />
          </div>
          <div class="carousel-dots">
            <span v-for="(ev, i) in recentCarousel" :key="i" class="carousel-dot" :class="{ active: carouselIndex === i }" @click="carouselIndex = i"></span>
          </div>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-card-icon">⚔️</div>
          <div class="stat-card-body">
            <div class="stat-value">14</div>
            <div class="stat-label">数据板块</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon">📝</div>
          <div class="stat-card-body">
            <div class="stat-value">70+</div>
            <div class="stat-label">示例数据</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon">🔄</div>
          <div class="stat-card-body">
            <div class="stat-value">持续更新</div>
            <div class="stat-label">数据状态</div>
          </div>
        </div>
      </div>

      <!-- Quick Links -->
      <h2 class="section-title">板块导航</h2>
      <div class="card-grid">
        <a v-for="item in navItems" :key="item.id" :href="item.path" class="home-card">
          <div class="home-card-icon">{{ item.icon }}</div>
          <div class="home-card-name">{{ item.name }}</div>
          <div class="home-card-count">{{ getItemCount(item.name) }} 条数据</div>
        </a>
      </div>
    </main>
  </div>
  <script type="module">
    import { createApp } from 'vue'
    import AppSidebar from './src/components/AppSidebar.vue'
    import { navItems } from './src/data/nav.js'
    import { sampleEvents } from './src/data/samples/events.js'
    import './src/assets/styles/variables.css'
    import './src/assets/styles/reset.css'
    import './src/assets/styles/layout.css'
    import './src/assets/styles/sidebar.css'
    import './src/assets/styles/table.css'
    import './src/assets/styles/cards.css'

    const countMap = {
      '角色': 5, '战斗': 5, '武器': 5, '防具': 5, '徽章': 5,
      '地图': 5, '灵晶': 5, '书架': 5, '猫': 5, '日记': 5,
      '专武': 5, '回生': 5, '副本': 5, '活动': 5
    }

    const app = createApp({
      data() { return { navItems, sidebarOpen: false, carouselIndex: 0, carouselTimer: null } },
      computed: {
        recentCarousel() { return [
          { name: '星之引导', img: 'https://picsum.photos/seed/star1/800/300' },
          { name: '龙神降临', img: 'https://picsum.photos/seed/dragon1/800/300' },
          { name: '异境讨伐', img: 'https://picsum.photos/seed/dimension1/800/300' },
          { name: '星导祭', img: 'https://picsum.photos/seed/festival1/800/300' }
        ] }
      },
      mounted() { this.carouselStart() },
      beforeUnmount() { clearInterval(this.carouselTimer) },
      methods: {
        toggleSidebar() { this.sidebarOpen = !this.sidebarOpen },
        getItemCount(name) { return countMap[name] || '待补充' },
        carouselStart() { this.carouselTimer = setInterval(() => { this.carouselIndex = (this.carouselIndex + 1) % this.recentCarousel.length }, 4000) },
        carouselPause() { clearInterval(this.carouselTimer) },
        carouselResume() { this.carouselStart() },

      }
    })
    app.component('app-sidebar', AppSidebar)
    app.mount('#app')
  </script>
</body>
</html>
