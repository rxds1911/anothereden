<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>另一个伊甸 - 攻略查询站</title>
</head>
<body>
  <div id="app">
    <button class="sidebar-toggle" @click="toggleSidebar">☰</button>
    <div class="sidebar-overlay" :class="{ show: sidebarOpen }" @click="toggleSidebar"></div>
    <aside class="sidebar" :class="{ open: sidebarOpen }">
      <app-sidebar current-page="index"></app-sidebar>
    </aside>
    <main class="main-content">

      <!-- Carousel -->
      <div class="carousel-wrap">
        <div class="carousel" @mouseenter="carouselPause" @mouseleave="carouselResume">
          <div v-for="(ev, i) in recentCarousel" :key="i" class="carousel-slide" :class="{ active: carouselIndex === i }">
            <a v-if="ev.url" :href="ev.url" target="_blank" rel="noopener" class="carousel-link">
              <img :src="ev.img" :alt="ev.name" class="carousel-img" />
            </a>
            <img v-else :src="ev.img" :alt="ev.name" class="carousel-img" />
          </div>
          <div class="carousel-dots">
            <span v-for="(ev, i) in recentCarousel" :key="i" class="carousel-dot" :class="{ active: carouselIndex === i }" @click="carouselIndex = i"></span>
          </div>
        </div>
      </div>

      <!-- Quick Links -->
      <h2 class="section-title">板块导航</h2>
      <div class="card-grid">
        <a v-for="item in gridNavItems" :key="item.id" :href="item.path" class="home-card">
          <div class="home-card-icon">{{ item.icon }}</div>
          <div class="home-card-name">{{ item.name }}</div>
          <div class="home-card-count">{{ getItemCount(item.name) }} 条数据</div>
        </a>
      </div>
    </main>
  </div>
  <script type="module">
    import { createApp } from 'vue'
    import AppSidebar from './src/components/AppSidebar.vue'
    import { navItems } from './src/data/nav.js'
    import { sampleEvents } from './src/data/samples/events.js'
    import { sampleCharacters } from './src/data/samples/characters.js'
    import { sampleBattles } from './src/data/samples/battle.js'
    import { sampleWeapons } from './src/data/samples/weapons.js'
    import { sampleArmor } from './src/data/samples/armor.js'
    import { sampleBadges } from './src/data/samples/badges.js'
    import { sampleMaps } from './src/data/samples/maps.js'
    import { sampleGrasta } from './src/data/samples/grasta.js'
    import { sampleBookshelf } from './src/data/samples/bookshelf.js'
    import { sampleCats } from './src/data/samples/cats.js'
    import { sampleDiary } from './src/data/samples/diary.js'
    import { samplePersonalWeapons } from './src/data/samples/personal-weapons.js'
    import { sampleReincarnation } from './src/data/samples/reincarnation.js'
    import { sampleDungeons } from './src/data/samples/dungeons.js'
    import { samplePartners } from './src/data/samples/partner.js'
    import './src/assets/styles/variables.css'
    import './src/assets/styles/reset.css'
    import './src/assets/styles/layout.css'
    import './src/assets/styles/sidebar.css'
    import './src/assets/styles/table.css'
    import './src/assets/styles/cards.css'

    const countMap = {
      '角色': sampleCharacters.length,
      '战斗': sampleBattles.length,
      '武器': sampleWeapons.length,
      '防具': sampleArmor.length,
      '徽章': sampleBadges.length,
      '地图': sampleMaps.length,
      '灵晶': sampleGrasta.length,
      '书架': sampleBookshelf.length,
      '猫': sampleCats.length,
      '日记': sampleDiary.length,
      '专武': samplePersonalWeapons.length,
      '回生': sampleReincarnation.length,
      '迷宫': sampleDungeons.length,
      '搭档': samplePartners.length,
      '活动': sampleEvents.length
    }

    const app = createApp({
      data() { return { navItems, sidebarOpen: window.innerWidth > 768, carouselIndex: 0, carouselTimer: null } },
      computed: {
        gridNavItems() { return navItems.filter(i => i.id !== 'index') },
        recentCarousel() {
          const slides = [
            { name: '首页推荐', img: '/screenshots/home/MuMu-20260808-102622-244.png', url: '/src/pages/events/index.html' }
          ]
          sampleEvents.forEach(ev => slides.push({ name: ev.name, img: ev.image, url: ev.url }))
          return slides
        }
      },
      mounted() { this.carouselStart() },
      beforeUnmount() { clearInterval(this.carouselTimer) },
      methods: {
        toggleSidebar() { this.sidebarOpen = !this.sidebarOpen },
        getItemCount(name) { return countMap[name] || '待补充' },
        carouselStart() { this.carouselTimer = setInterval(() => { this.carouselIndex = (this.carouselIndex + 1) % this.recentCarousel.length }, 4000) },
        carouselPause() { clearInterval(this.carouselTimer) },
        carouselResume() { this.carouselStart() },

      }
    })
    app.component('app-sidebar', AppSidebar)
    app.mount('#app')
  </script>
</body>
</html>
